services:
  dev:
    image: taxbrokerreport-dev
    user: "${UID}:${GID}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ..:/workspace
      - ../logs:/var/log/taxbroker
    environment:
      - TBR_LOG_FILE=/var/log/taxbroker/taxbroker.log
      - TBR_SERVER_HOST=0.0.0.0
      - TBR_SERVER_PORT=8080
      # The saved taxpayer profile goes to the ignored runtime/ folder.
      - XDG_DATA_HOME=/workspace/runtime/data
    # Capabilities required for debuggers (lldb/gdb) and valgrind to hook into processes
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    # Keep standard streams open
    stdin_open: true
    tty: true

  # The development image plus Chromium, for the browser tests (scripts/e2e.sh). No ports: the
  # tests start the server on a free port inside the container.
  e2e:
    image: taxbrokerreport-e2e
    user: "${UID}:${GID}"
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: e2e
    volumes:
      - ..:/workspace

  prod:
    image: taxbrokerreport-prod
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: prod
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - taxbroker_logs:/var/log/taxbroker
      - taxbroker_data:/var/lib/taxbroker
    environment:
      - TBR_LOG_FILE=/var/log/taxbroker/taxbroker.log
      - TBR_SERVER_HOST=0.0.0.0
      - TBR_SERVER_PORT=8080
      # The saved taxpayer profile stays in a named volume, outside the container filesystem.
      - XDG_DATA_HOME=/var/lib/taxbroker

volumes:
  taxbroker_logs:
  taxbroker_data:
