name: Build and Test

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    # Keep this name stable: the main-branch protection rule should require this check.
    name: Required tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build development image and test binaries
        run: scripts/build.sh docker-build

      - name: Run all tests
        run: scripts/test.sh

  production-image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build production image
        run: scripts/build.sh prod
