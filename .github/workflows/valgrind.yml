name: Valgrind

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  valgrind:
    name: Valgrind
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build development image and C++ targets
        run: scripts/build.sh docker-build

      - name: Run Valgrind memory checks
        run: scripts/valgrind.sh
