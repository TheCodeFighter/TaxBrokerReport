name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dev-image:
    # Keep this name stable: the main-branch protection rule should require this check.
    name: Dev image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build development image
        run: scripts/build.sh image

      - name: Save development image
        run: docker save taxbrokerreport-dev | zstd -T0 -3 -o "$RUNNER_TEMP/dev-image.tar.zst"

      - name: Upload development image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dev-image
          path: ${{ runner.temp }}/dev-image.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  development-build:
    # Keep this name stable: the main-branch protection rule should require this check.
    name: Development build
    needs: dev-image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      # Set once the build tree is uploaded, so a later failing step (the boundary check) still
      # lets the jobs that use the tree run.
      tree-uploaded: ${{ steps.upload-tree.outcome }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load development image
        uses: ./.github/actions/load-dev-image

      - name: Build C++ targets from scratch
        run: scripts/build.sh dev

      - name: Save build tree
        run: tar -C "$GITHUB_WORKSPACE" -cf - build/dev | zstd -T0 -3 -o "$RUNNER_TEMP/dev-build.tar.zst"

      - name: Upload build tree
        id: upload-tree
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dev-build
          path: ${{ runner.temp }}/dev-build.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # These tests run cmake --build on a probe file. Here the tree is fresh; in the test jobs
      # the restored tree looks outdated and the build would recompile the backend. They run after
      # the upload, so a boundary failure still lets the test, Valgrind and Cppcheck jobs run.
      - name: Check the public API boundary
        run: scripts/test.sh --reuse-build --suite boundary

  production-image:
    # Keep this name stable: the main-branch protection rule should require this check.
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build production image
        run: scripts/build.sh prod

      # The runner is Ubuntu (glibc, no musl), so this also proves the binaries run outside Alpine.
      - name: Check the static binaries
        run: |
          set -euo pipefail
          export TBR_LOG_FILE="$RUNNER_TEMP/taxbroker.log"

          for binary in build/static/taxbroker build/static/taxbroker_server; do
            file "$binary" | grep -q 'statically linked'
          done

          cmake \
            -DCLI=build/static/taxbroker \
            -DFIXTURE_DIR=tests/test_data/cli \
            -DOUTPUT_DIR="$RUNNER_TEMP/cli-check" \
            -P tests/support/check_cli_report.cmake

          # The server serves until a signal: start it, wait for the page, then stop it. Its
          # output (the one-time link of this throwaway run) is not kept.
          launch_file="$RUNNER_TEMP/launch/launch.html"
          mkdir -p "$(dirname "$launch_file")"
          TBR_LAUNCH_FILE="$launch_file" TBR_SERVER_PORT=18080 \
            build/static/taxbroker_server >/dev/null &
          server_pid=$!

          # A 200 proves that it serves, so its SIGTERM handler is set already.
          curl --silent --show-error --fail --output /dev/null \
            --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:18080/

          # The frontend of the production image is embedded: its script and style are served.
          for asset in assets/app.js assets/app.css assets/logo.webp; do
            curl --silent --show-error --fail --output /dev/null "http://127.0.0.1:18080/$asset"
          done

          kill -TERM "$server_pid"
          wait "$server_pid"
          test ! -e "$launch_file"

      # The browser tests job runs these same binaries. The tar archive keeps the executable bits.
      - name: Save the static binaries for the browser tests
        run: tar -C build/static -cf "$RUNNER_TEMP/static-binaries.tar" taxbroker taxbroker_server

      - name: Upload the static binaries for the browser tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: static-binaries
          path: ${{ runner.temp }}/static-binaries.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      # Only a push to main uploads the binaries; pull requests only build and check them.
      - name: Package the static binaries
        if: github.event_name == 'push'
        id: package
        run: |
          set -euo pipefail

          # The tar archive keeps the executable bits; the artifact upload alone does not.
          # THIRD_PARTY_NOTICES.txt holds the licences of the code linked into the binaries.
          tar -czf "$RUNNER_TEMP/taxbroker-linux-x86_64.tar.gz" \
            -C build/static taxbroker taxbroker_server \
            -C "$GITHUB_WORKSPACE" LICENSE THIRD_PARTY_NOTICES.txt
          echo "short_sha=${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"

      - name: Upload the static binaries
        if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: taxbroker-linux-x86_64-${{ steps.package.outputs.short_sha }}
          path: ${{ runner.temp }}/taxbroker-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  tests:
    # Keep this name stable: the main-branch protection rule should require this check.
    name: Required tests
    needs: development-build
    if: ${{ !cancelled() && needs.development-build.outputs.tree-uploaded == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load development image
        uses: ./.github/actions/load-dev-image

      - name: Load build tree
        id: load-build
        uses: ./.github/actions/load-dev-build

      - name: Run unit tests
        run: scripts/test.sh --reuse-build --suite unit

      - name: Run integration tests
        if: ${{ !cancelled() && steps.load-build.outcome == 'success' }}
        run: scripts/test.sh --reuse-build --suite integration

  valgrind:
    # Keep this name stable: the main-branch protection rule should require this check.
    name: Valgrind
    needs: development-build
    if: ${{ !cancelled() && needs.development-build.outputs.tree-uploaded == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load development image
        uses: ./.github/actions/load-dev-image

      - name: Load build tree
        uses: ./.github/actions/load-dev-build

      - name: Run Valgrind memory checks
        run: scripts/valgrind.sh --reuse-build --part regular

  # Not a required check. The *LargeInputTest unit tests take minutes under Valgrind, so each part
  # (`scripts/valgrind.sh --part <part>`) has its own job. A pull request runs a part only when
  # one of its paths changes; a push to main always runs every part.
  valgrind-large-inputs:
    name: Valgrind (${{ matrix.part }})
    needs: development-build
    if: ${{ !cancelled() && needs.development-build.outputs.tree-uploaded == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - part: csv
            paths: 'tests/unit/csv_text_reader_test\.cpp'
          - part: ecb
            paths: >-
              src/parsers/ecb_rate_file\.cpp|src/parsers/ecb_rate_file\.hpp
              |include/taxbroker/official_rates\.hpp
              |src/utils/date_utils\.cpp|src/utils/numeric_util\.cpp
              |resources/ecb/.*|src/utils/built_in_ecb_rates\.cpp\.in
              |src/utils/diagnostic_messages\.cpp|include/taxbroker/diagnostic_messages\.hpp
              |resources/i18n/.*|tests/unit/ecb_rate_file_test\.cpp
          - part: reference
            paths: >-
              src/parsers/reference_catalogue\.cpp|src/parsers/reference_catalogue\.hpp
              |include/taxbroker/reference_catalogue\.hpp
              |resources/reference/.*|src/utils/embedded_text\.cpp\.in
              |src/utils/diagnostic_messages\.cpp
              |include/taxbroker/diagnostic_messages\.hpp|resources/i18n/.*
              |tests/unit/reference_catalogue_test\.cpp
          - part: messages
            paths: >-
              src/utils/diagnostic_messages\.cpp|include/taxbroker/diagnostic_messages\.hpp
              |src/utils/embedded_text\.cpp\.in
              |resources/i18n/.*|tests/unit/diagnostic_messages_test\.cpp

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for related changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PART_PATHS: ${{ matrix.paths }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          # Paths that every part depends on, then the paths of this part (the YAML folds the
          # lines of PART_PATHS into one line with spaces, which are removed here).
          shared='src/utils/csv_text_reader\.cpp|src/utils/csv_text_reader\.hpp'
          shared+='|(.*/)?CMakeLists\.txt|docker/.*|scripts/valgrind\.sh|scripts/lib\.sh'
          shared+='|\.github/workflows/ci\.yml'
          watched="^(${shared}|${PART_PATHS// /})$"

          if git diff --name-only "$BASE_SHA...HEAD" | grep -Eq "$watched"; then
              echo "run=true" >> "$GITHUB_OUTPUT"
          else
              echo "Skipped: no change that the ${{ matrix.part }} part depends on."
              echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load development image
        if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/load-dev-image

      - name: Load build tree
        if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/load-dev-build

      - name: Run Valgrind memory checks on the ${{ matrix.part }} large inputs
        if: steps.changes.outputs.run == 'true'
        run: scripts/valgrind.sh --reuse-build --part ${{ matrix.part }}

  cppcheck:
    # Keep this name stable: the main-branch protection rule should require this check.
    name: Cppcheck
    needs: development-build
    if: ${{ !cancelled() && needs.development-build.outputs.tree-uploaded == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load development image
        uses: ./.github/actions/load-dev-image

      - name: Load build tree
        uses: ./.github/actions/load-dev-build

      - name: Run Cppcheck static analysis
        run: scripts/cppcheck.sh --reuse-build

  # Keep this name stable: the main-branch protection rule should require this check. It waits
  # only for the dev image, so it runs beside the development build and the coverage jobs, and
  # the whole job still ends before the slowest of those jobs.
  fuzz:
    name: Fuzz (Trade Republic parser)
    needs: dev-image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load development image
        uses: ./.github/actions/load-dev-image

      - name: Fuzz the Trade Republic parser for 240 seconds
        run: scripts/fuzz.sh --seconds 240

      - name: Upload the input that broke a check
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-findings
          path: |
            runtime/fuzz/crash-*
            runtime/fuzz/leak-*
            runtime/fuzz/oom-*
            runtime/fuzz/slow-unit-*
            runtime/fuzz/timeout-*
          if-no-files-found: ignore
          retention-days: 14

  # The same as the job above for the Interactive Brokers parser. Keep this name stable: the
  # main-branch protection rule should require this check. The two jobs run in parallel, so the
  # whole run is not longer.
  fuzz-ibkr:
    name: Fuzz (IBKR parser)
    needs: dev-image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load development image
        uses: ./.github/actions/load-dev-image

      - name: Fuzz the Interactive Brokers parser for 240 seconds
        run: scripts/fuzz.sh --target ibkr --seconds 240

      - name: Upload the input that broke a check
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fuzz-findings-ibkr
          path: |
            runtime/fuzz/crash-*
            runtime/fuzz/leak-*
            runtime/fuzz/oom-*
            runtime/fuzz/slow-unit-*
            runtime/fuzz/timeout-*
          if-no-files-found: ignore
          retention-days: 14

  format-check:
    # Keep this job id stable: it is the check name that the main-branch protection rule requires.
    if: github.event_name == 'pull_request'
    needs: dev-image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Load development image
        uses: ./.github/actions/load-dev-image

      - name: Validate code formatting
        run: scripts/format.sh --check

  # The frontend (frontend/) is built and checked in the dev image: npm ci (no install scripts),
  # type check, tests, build and the size and content check. A pull request runs the steps only
  # when a frontend file, the script or the Docker files change; a push to main always runs them.
  # The job itself always runs and reports success when the steps are skipped, so the main-branch
  # protection rule can require it. The production image builds the frontend again in its own
  # stage.
  frontend:
    # Keep this name stable: the main-branch protection rule should require this check.
    name: Frontend
    needs: dev-image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for related changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          watched='^(frontend/.*|scripts/frontend(_check)?\.sh|scripts/lib\.sh|docker/.*'
          watched+='|resources/i18n/.*|\.github/workflows/ci\.yml)$'

          if git diff --name-only "$BASE_SHA...HEAD" | grep -Eq "$watched"; then
              echo "run=true" >> "$GITHUB_OUTPUT"
          else
              echo "Skipped: no change that the frontend depends on."
              echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load development image
        if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/load-dev-image

      - name: Build and check the frontend
        if: steps.changes.outputs.run == 'true'
        run: scripts/frontend.sh

  # The browser tests (frontend/e2e): Chromium drives the page against the static
  # taxbroker_server of the Production image job. They run in the e2e image (the dev image plus
  # Chromium, built here, so the dev image that every job loads stays small). A pull request runs
  # the steps only when a file that the page, the server or the tests depend on changes; a push to
  # main always runs them. The job itself always runs and reports success when the steps are
  # skipped, so the main-branch protection rule can require it.
  browser-tests:
    # Keep this name stable: the main-branch protection rule should require this check.
    name: Browser tests
    needs: [dev-image, production-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for related changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request ]]; then
              echo "run=true" >> "$GITHUB_OUTPUT"
              exit 0
          fi

          watched='^(frontend/.*|src/.*|include/.*|resources/.*|docker/.*|CMakeLists\.txt'
          watched+='|scripts/(e2e|build|lib|frontend)\.sh|tests/test_data/manual/.*'
          watched+='|\.github/(workflows/ci\.yml|actions/.*))$'

          if git diff --name-only "$BASE_SHA...HEAD" | grep -Eq "$watched"; then
              echo "run=true" >> "$GITHUB_OUTPUT"
          else
              echo "Skipped: no change that the browser tests depend on."
              echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Load development image
        if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/load-dev-image

      - name: Build the browser test image
        if: steps.changes.outputs.run == 'true'
        run: scripts/build.sh e2e-image

      - name: Download the static binaries
        if: steps.changes.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: static-binaries
          path: ${{ runner.temp }}/static-binaries

      - name: Unpack the static binaries
        if: steps.changes.outputs.run == 'true'
        run: |
          mkdir -p build/static
          tar -C build/static -xf "$RUNNER_TEMP/static-binaries/static-binaries.tar"

      - name: Install the frontend packages
        if: steps.changes.outputs.run == 'true'
        run: scripts/frontend.sh install

      - name: Run the browser tests
        if: steps.changes.outputs.run == 'true'
        run: scripts/e2e.sh --reuse-build

      - name: Upload the screenshots of failed tests
        if: failure() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-test-screenshots
          path: runtime/e2e/
          if-no-files-found: ignore
          retention-days: 7

  # The pull-request commit and its base commit are measured in parallel, each from a clean
  # coverage build. The coverage job then compares them.
  coverage-measure:
    # Keep these names stable: the main-branch protection rule should require both checks.
    name: Coverage (${{ matrix.target }})
    if: github.event_name == 'pull_request'
    needs: dev-image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: current
            ref: ${{ github.event.pull_request.head.sha }}
          - target: baseline
            ref: ${{ github.event.pull_request.base.sha }}

    steps:
      - name: Checkout pull-request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: current

      - name: Checkout base commit
        if: matrix.target == 'baseline'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ matrix.ref }}
          path: baseline

      - name: Load development image
        uses: ./current/.github/actions/load-dev-image

      - name: Use the pull-request coverage script for the base commit
        if: matrix.target == 'baseline'
        run: |
          cp current/scripts/coverage.sh baseline/scripts/coverage.sh
          chmod +x baseline/scripts/coverage.sh

      - name: Measure coverage
        working-directory: ${{ matrix.target }}
        run: scripts/coverage.sh

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.target }}
          path: ${{ matrix.target }}/coverage/
          if-no-files-found: error
          retention-days: 1

  coverage:
    # Keep this job id stable: it is the check name that the main-branch protection rule requires.
    if: github.event_name == 'pull_request'
    needs: coverage-measure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Download pull-request coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-current
          path: current/coverage

      - name: Download base coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: coverage-baseline
          path: baseline/coverage

      - name: Compare coverage
        id: compare
        shell: bash
        run: |
          set -euo pipefail

          source current/coverage/metrics.env
          current_lines_hit="$lines_hit"
          current_lines_found="$lines_found"
          current_line_rate="$line_rate"

          source baseline/coverage/metrics.env
          baseline_lines_hit="$lines_hit"
          baseline_lines_found="$lines_found"
          baseline_line_rate="$line_rate"

          delta="$(awk \
            -v current="$current_line_rate" \
            -v baseline="$baseline_line_rate" \
            'BEGIN { printf "%+.4f", current - baseline }')"

          dropped=false
          result="maintained or improved"
          if ((current_lines_hit * baseline_lines_found < baseline_lines_hit * current_lines_found)); then
            dropped=true
            result="decreased"
          fi

          print_coverage_row() {
            local suite="$1"
            local report_path="$2"
            local lines_hit lines_found line_rate
            local current_hit current_found current_rate
            local baseline_hit baseline_found baseline_rate suite_delta

            # shellcheck source=/dev/null
            source "current/coverage/${report_path}metrics.env"
            current_hit="$lines_hit"
            current_found="$lines_found"
            current_rate="$line_rate"

            # shellcheck source=/dev/null
            source "baseline/coverage/${report_path}metrics.env"
            baseline_hit="$lines_hit"
            baseline_found="$lines_found"
            baseline_rate="$line_rate"

            suite_delta="$(awk -v current="$current_rate" -v baseline="$baseline_rate" \
              'BEGIN { printf "%+.4f", current - baseline }')"

            echo "| ${suite} | ${baseline_hit} / ${baseline_found} (${baseline_rate}%) | ${current_hit} / ${current_found} (${current_rate}%) | ${suite_delta} pp |"
          }

          report_file="current/coverage/pr-summary.md"
          {
            echo '<!-- taxbroker-coverage-report -->'
            if [[ "$dropped" == "true" ]]; then
              echo '## ⚠️ Test coverage decreased'
            else
              echo '## Test coverage'
            fi
            echo
            echo '| Suite | Base covered lines (coverage) | PR covered lines (coverage) | Change |'
            echo '| --- | ---: | ---: | ---: |'
            print_coverage_row 'Combined' ''
            print_coverage_row 'Unit' 'unit/'
            print_coverage_row 'Integration' 'integration/'
            echo
            echo 'All reports measure production code only. Combined coverage is the union of both suites, not the sum of their percentages; only the combined result controls the coverage warning.'
            echo

            if [[ "$dropped" == "true" ]]; then
              echo '> [!CAUTION]'
              echo '> **This pull request reduces line coverage. Please add or improve tests before merging.**'
            else
              echo "Coverage **${result}** compared with the pull request's base commit."
            fi
          } >"$report_file"

          cat "$report_file" >>"$GITHUB_STEP_SUMMARY"
          echo "dropped=$dropped" >>"$GITHUB_OUTPUT"

          if [[ "$dropped" == "true" ]]; then
            echo "::warning title=Line coverage decreased::Coverage changed by ${delta} percentage points. Please add or improve tests before merging."
          fi

      - name: Upload HTML coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-coverage-html
          path: current/coverage/
          if-no-files-found: warn
          retention-days: 14

      - name: Update coverage comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- taxbroker-coverage-report -->';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 }
            );
            const existing = comments.find(
              comment => comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            const body = fs.readFileSync('current/coverage/pr-summary.md', 'utf8');

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
