# Weekly update pull requests for the Docker base images and the GitHub Actions versions.
# FetchContent pins in the CMake files (spdlog, csv-parser, nlohmann_json, googletest) and the
# lcov archive in docker/Dockerfile are not covered and stay manual. The vcpkg baseline
# (builtin-baseline in vcpkg.json) is a full commit SHA that the native CI jobs clone: raise it by
# hand, in vcpkg.json only (the jobs read it from there).
version: 2
updates:
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly

  # "/" covers .github/workflows; the composite actions in .github/actions need their own entry.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
